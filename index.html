<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M4A to MP3 변환기 (완성형)</title>
    
    <script src="https://unpkg.com/@ffmpeg/ffmpeg@0.12.6/dist/umd/ffmpeg.js"></script>
    <script src="https://unpkg.com/@ffmpeg/util@0.12.1/dist/umd/index.js"></script>
    
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: white;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            text-align: center;
            width: 100%;
            max-width: 440px;
        }
        h2 { margin-top: 0; color: #1a1a1a; font-size: 24px; }
        p { color: #666; font-size: 14px; margin-bottom: 25px; }
        
        /* 드롭존 및 파일 선택 영역 */
        .file-box {
            margin: 20px 0; 
            padding: 40px 20px;
            border: 2px dashed #cbd5e1; 
            border-radius: 12px;
            background-color: #f8fafc; 
            transition: all 0.2s ease-in-out;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }
        .file-box.dragover {
            border-color: #2563eb;
            background-color: #eff6ff;
            transform: scale(1.02);
        }
        #fileInfo {
            color: #64748b;
            font-size: 14px;
            line-height: 1.6;
            word-break: break-all;
        }
        
        /* 명시적인 파일 불러오기 버튼 */
        .browse-btn {
            background-color: white;
            color: #2563eb;
            border: 1px solid #2563eb;
            padding: 8px 16px;
            font-size: 14px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .browse-btn:hover {
            background-color: #eff6ff;
        }

        /* 변환 시작 버튼 */
        .convert-btn {
            background-color: #2563eb; color: white; border: none;
            padding: 14px; font-size: 16px; font-weight: bold;
            border-radius: 8px; cursor: pointer; transition: background-color 0.2s;
            width: 100%; margin-top: 10px;
        }
        .convert-btn:hover { background-color: #1d4ed8; }
        .convert-btn:disabled { background-color: #94a3b8; cursor: not-allowed; }
        
        #status { margin-top: 20px; font-size: 14px; color: #475569; min-height: 20px; line-height: 1.5; }
        #downloadLink {
            display: inline-block; margin-top: 20px; text-decoration: none;
            color: white; background-color: #10b981; padding: 12px 24px;
            font-weight: bold; border-radius: 8px; width: calc(100% - 48px);
            transition: background-color 0.2s;
        }
        #downloadLink:hover { background-color: #059669; }
    </style>
</head>
<body>

<div class="container">
    <h2>🎵 M4A ➔ MP3 변환기</h2>
    <p>서버 전송 없이 브라우저에서 직접 안전하게 변환합니다.</p>
    
    <div class="file-box" id="dropZone">
        <input type="file" id="audioFile" accept=".m4a" style="display: none;">
        
        <div id="fileInfo">
            📂 <strong>M4A 파일을 이곳으로 끌어오세요</strong>
        </div>
        
        <button class="browse-btn" onclick="document.getElementById('audioFile').click()">
            컴퓨터에서 파일 불러오기
        </button>
    </div>
    
    <button id="convertBtn" class="convert-btn">MP3로 변환 시작</button>
    
    <div id="status">파일을 선택하고 변환 버튼을 눌러주세요.</div>
    <a id="downloadLink" style="display: none;">📥 변환된 MP3 다운로드</a>
</div>

<script>
    const { FFmpeg } = window.FFmpeg;
    const { fetchFile } = window.FFmpegUtil;
    
    let ffmpeg = null;
    let selectedFile = null; // 선택된 파일을 명시적으로 저장할 변수 (버그 해결의 핵심)

    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('audioFile');
    const fileInfo = document.getElementById('fileInfo');
    const convertBtn = document.getElementById('convertBtn');
    const statusDiv = document.getElementById('status');
    const downloadLink = document.getElementById('downloadLink');

    // --- 1. 파일 선택 및 드래그 앤 드롭 이벤트 처리 --- //

    // 사용자가 버튼을 눌러 파일을 선택했을 때
    fileInput.addEventListener('change', (e) => {
        if (e.target.files.length > 0) {
            handleFile(e.target.files[0]);
        }
    });

    // 화면에 파일이 들어왔을 때 (브라우저가 파일을 여는 것 방지)
    dropZone.addEventListener('dragenter', (e) => {
        e.preventDefault();
        dropZone.classList.add('dragover');
    });

    dropZone.addEventListener('dragover', (e) => {
        e.preventDefault();
        dropZone.classList.add('dragover');
    });

    dropZone.addEventListener('dragleave', (e) => {
        e.preventDefault();
        dropZone.classList.remove('dragover');
    });

    // 영역에 파일을 떨어뜨렸을 때
    dropZone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropZone.classList.remove('dragover');
        
        if (e.dataTransfer.files.length > 0) {
            handleFile(e.dataTransfer.files[0]); // 드롭된 파일을 직접 전달
        }
    });

    // 파일 유효성 검사 및 화면 업데이트 함수
    function handleFile(file) {
        if (!file.name.toLowerCase().endsWith('.m4a')) {
            alert('M4A 형식의 파일만 지원합니다.');
            selectedFile = null;
            fileInfo.innerHTML = `📂 <strong>M4A 파일을 이곳으로 끌어오세요</strong>`;
            statusDiv.innerHTML = "❌ M4A 파일이 아닙니다.";
            return;
        }

        selectedFile = file; // 변환 시 사용할 수 있도록 변수에 저장
        const fileSizeMB = (file.size / (1024 * 1024)).toFixed(2);
        
        // 화면에 선택된 파일 정보 표시
        fileInfo.innerHTML = `
            📄 <strong>선택된 파일:</strong><br>
            ${file.name}<br>
            <span style="font-size: 12px; color: #2563eb; font-weight: bold;">(${fileSizeMB} MB)</span>
        `;
        statusDiv.innerHTML = "✅ 변환 준비 완료! '변환 시작' 버튼을 누르세요.";
        downloadLink.style.display = 'none';
    }


    // --- 2. FFmpeg 변환 로직 --- //

    async function initFFmpeg() {
        if (ffmpeg) return;
        ffmpeg = new FFmpeg();
        
        const baseURL = 'https://unpkg.com/@ffmpeg/core@0.12.6/dist/umd';
        await ffmpeg.load({
            coreURL: `${baseURL}/ffmpeg-core.js`,
            wasmURL: `${baseURL}/ffmpeg-core.wasm`
        });
    }

    convertBtn.addEventListener('click', async () => {
        // fileInput.files 대신 명시적으로 저장한 selectedFile 변수 사용
        if (!selectedFile) {
            alert('M4A 파일을 먼저 추가해주세요.');
            return;
        }

        try {
            convertBtn.disabled = true;
            downloadLink.style.display = 'none';
            statusDiv.innerHTML = "엔진 로딩 중... ⏳<br>(최초 실행 시에만 다운로드 시간이 소요됩니다)";

            await initFFmpeg();

            statusDiv.innerHTML = "오디오 변환 중입니다. 잠시만 기다려주세요... ⚙️";

            // 가상 파일 시스템에 파일 쓰기 (selectedFile 사용)
            await ffmpeg.writeFile('input.m4a', await fetchFile(selectedFile));
            
            // 변환 실행
            await ffmpeg.exec(['-i', 'input.m4a', 'output.mp3']);

            statusDiv.innerHTML = "파일 처리 완료! 다운로드 링크를 생성합니다... 📄";

            // 변환된 파일 가져오기
            const data = await ffmpeg.readFile('output.mp3');
            const blob = new Blob([data.buffer], { type: 'audio/mp3' });
            const url = URL.createObjectURL(blob);
            
            // 원본 파일명 유지하며 확장자만 변경
            const outputName = selectedFile.name.replace(/\.[^/.]+$/, "") + ".mp3";

            downloadLink.href = url;
            downloadLink.download = outputName;
            downloadLink.style.display = 'inline-block';
            statusDiv.innerHTML = "🎉 변환이 성공적으로 완료되었습니다!";

        } catch (error) {
            console.error("FFmpeg Error:", error);
            statusDiv.innerHTML = "❌ 변환 중 오류가 발생했습니다.<br>브라우저 개발자 도구의 콘솔(Console)을 확인해주세요.";
        } finally {
            convertBtn.disabled = false;
        }
    });
</script>

</body>
</html>
