<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M4A to MP3 변환기 (완성판)</title>
    
    <script src="https://unpkg.com/@ffmpeg/ffmpeg@0.12.6/dist/umd/ffmpeg.js"></script>
    <script src="https://unpkg.com/@ffmpeg/util@0.12.1/dist/umd/index.js"></script>
    
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: white;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            text-align: center;
            width: 100%;
            max-width: 440px;
        }
        h2 { margin-top: 0; color: #1a1a1a; font-size: 24px; }
        p { color: #666; font-size: 14px; margin-bottom: 25px; }
        
        .file-box {
            margin: 20px 0; padding: 40px 20px; border: 2px dashed #cbd5e1; 
            border-radius: 12px; background-color: #f8fafc; 
            transition: all 0.2s ease-in-out; display: flex; flex-direction: column;
            align-items: center; gap: 15px;
        }
        .file-box.dragover { border-color: #2563eb; background-color: #eff6ff; transform: scale(1.02); }
        #fileInfo { color: #64748b; font-size: 14px; line-height: 1.6; word-break: break-all; }
        
        .browse-btn {
            background-color: white; color: #2563eb; border: 1px solid #2563eb;
            padding: 8px 16px; font-size: 14px; border-radius: 6px; cursor: pointer;
            transition: all 0.2s;
        }
        .browse-btn:hover { background-color: #eff6ff; }

        .convert-btn {
            background-color: #2563eb; color: white; border: none; padding: 14px; 
            font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; 
            width: 100%; margin-top: 10px; transition: background-color 0.2s;
        }
        .convert-btn:hover { background-color: #1d4ed8; }
        .convert-btn:disabled { background-color: #94a3b8; cursor: not-allowed; }
        
        #status { margin-top: 20px; font-size: 14px; color: #475569; min-height: 20px; line-height: 1.5; }
        #downloadLink {
            display: inline-block; margin-top: 20px; text-decoration: none; color: white; 
            background-color: #10b981; padding: 12px 24px; font-weight: bold; 
            border-radius: 8px; width: calc(100% - 48px); transition: background-color 0.2s;
        }
        #downloadLink:hover { background-color: #059669; }
    </style>
</head>
<body>

<div class="container">
    <h2>🎵 M4A ➔ MP3 변환기</h2>
    <p>서버 전송 없이 브라우저에서 직접 안전하게 변환합니다.</p>
    
    <div class="file-box" id="dropZone">
        <input type="file" id="audioFile" accept=".m4a" style="display: none;">
        <div id="fileInfo">📂 <strong>M4A 파일을 이곳으로 끌어오세요</strong></div>
        <button class="browse-btn" id="browseBtn">컴퓨터에서 파일 불러오기</button>
    </div>
    
    <button id="convertBtn" class="convert-btn">MP3로 변환 시작</button>
    
    <div id="status">파일을 선택하고 변환 버튼을 눌러주세요.</div>
    <a id="downloadLink" style="display: none;">📥 변환된 MP3 다운로드</a>
</div>

<script>
    let ffmpeg = null;
    let selectedFile = null;

    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('audioFile');
    const fileInfo = document.getElementById('fileInfo');
    const browseBtn = document.getElementById('browseBtn');
    const convertBtn = document.getElementById('convertBtn');
    const statusDiv = document.getElementById('status');
    const downloadLink = document.getElementById('downloadLink');

    // --- 1. 파일 UI 및 드래그 로직 ---
    browseBtn.addEventListener('click', () => { fileInput.value = ''; fileInput.click(); });
    fileInput.addEventListener('change', (e) => { if (e.target.files.length > 0) handleFile(e.target.files[0]); });

    ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(e => {
        dropZone.addEventListener(e, preventDefaults, false);
        document.body.addEventListener(e, preventDefaults, false);
    });

    function preventDefaults(e) { e.preventDefault(); e.stopPropagation(); }
    ['dragenter', 'dragover'].forEach(e => dropZone.addEventListener(e, () => dropZone.classList.add('dragover'), false));
    ['dragleave', 'drop'].forEach(e => dropZone.addEventListener(e, () => dropZone.classList.remove('dragover'), false));

    dropZone.addEventListener('drop', (e) => {
        if (e.dataTransfer.files.length > 0) handleFile(e.dataTransfer.files[0]);
    });

    function handleFile(file) {
        if (!file.name.toLowerCase().endsWith('.m4a')) {
            alert('M4A 형식의 파일만 지원합니다.');
            selectedFile = null;
            fileInfo.innerHTML = `📂 <strong>M4A 파일을 이곳으로 끌어오세요</strong>`;
            statusDiv.innerHTML = "❌ M4A 파일이 아닙니다.";
            return;
        }
        selectedFile = file;
        const fileSizeMB = (file.size / (1024 * 1024)).toFixed(2);
        fileInfo.innerHTML = `📄 <strong>선택된 파일:</strong><br>${file.name}<br><span style="font-size: 12px; color: #2563eb; font-weight: bold;">(${fileSizeMB} MB)</span>`;
        statusDiv.innerHTML = "✅ 변환 준비 완료! '변환 시작' 버튼을 누르세요.";
        downloadLink.style.display = 'none';
    }

    // --- 2. 오디오 변환 및 설치 로직 ---
    async function initFFmpeg() {
        // 이미 완벽하게 설치되었다면 이 과정을 생략 (중복 에러 방지)
        if (ffmpeg && ffmpeg.loaded) return;

        try {
            let FFmpegClass = window.FFmpegWASM?.FFmpeg || window.FFmpeg?.FFmpeg;
            ffmpeg = new FFmpegClass();
            
            // F12 개발자 도구의 콘솔 창에 진행 상황을 기록
            ffmpeg.on('log', ({ message }) => console.log('[FFmpeg]', message));

            const { toBlobURL } = window.FFmpegUtil;
            const coreURL = 'https://unpkg.com/@ffmpeg/core@0.12.6/dist/umd';
            const ffmpegURL = 'https://unpkg.com/@ffmpeg/ffmpeg@0.12.6/dist/umd';

            // 각각의 파일이 정상적으로 다운로드되는지 화면에 표시
            statusDiv.innerHTML = "보안 환경 구성 중 (1/3) 다운로드 ... ⏳";
            const cURL = await toBlobURL(`${coreURL}/ffmpeg-core.js`, 'text/javascript');
            
            statusDiv.innerHTML = "보안 환경 구성 중 (2/3) 다운로드 ... ⏳";
            const wURL = await toBlobURL(`${coreURL}/ffmpeg-core.wasm`, 'application/wasm');
            
            statusDiv.innerHTML = "보안 환경 구성 중 (3/3) 다운로드 ... ⏳";
            const workerURL = await toBlobURL(`${ffmpegURL}/814.ffmpeg.js`, 'text/javascript');

            statusDiv.innerHTML = "엔진을 브라우저에 장착 중... ⚙️";
            await ffmpeg.load({
                coreURL: cURL,
                wasmURL: wURL,
                classWorkerURL: workerURL
            });
            
        } catch (error) {
            // 설치 중간에 뻑이 나면 찌꺼기가 남지 않게 깨끗이 비워줌 (다음 클릭 시 재시도 가능)
            ffmpeg = null; 
            throw error;
        }
    }

    convertBtn.addEventListener('click', async () => {
        if (!selectedFile) {
            alert('M4A 파일을 먼저 추가해주세요.');
            return;
        }

        try {
            convertBtn.disabled = true;
            downloadLink.style.display = 'none';
            
            await initFFmpeg(); // 여기서 에러가 나면 아래 코드는 실행되지 않음

            statusDiv.innerHTML = "오디오 변환 중입니다. 잠시만 기다려주세요... ⚙️";
            const fetchFileFn = window.FFmpegUtil.fetchFile;

            await ffmpeg.writeFile('input.m4a', await fetchFileFn(selectedFile));
            await ffmpeg.exec(['-i', 'input.m4a', 'output.mp3']);

            statusDiv.innerHTML = "파일 처리 완료! 다운로드 링크를 생성합니다... 📄";

            const data = await ffmpeg.readFile('output.mp3');
            const blob = new Blob([data.buffer], { type: 'audio/mp3' });
            const url = URL.createObjectURL(blob);
            
            const outputName = selectedFile.name.replace(/\.[^/.]+$/, "") + ".mp3";

            downloadLink.href = url;
            downloadLink.download = outputName;
            downloadLink.style.display = 'inline-block';
            statusDiv.innerHTML = "🎉 변환이 성공적으로 완료되었습니다!";

        } catch (error) {
            console.error("FFmpeg Error:", error);
            // 에러 발생 시 진행 단계를 텍스트로 보여주어 원인 파악
            statusDiv.innerHTML = `❌ 오류 발생: <br><span style="color:red; font-size:12px;">${error.message}</span>`;
        } finally {
            convertBtn.disabled = false;
        }
    });
</script>

</body>
</html>
