<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M4A to MP3 변환기</title>
    <script src="https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.11.6/dist/ffmpeg.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            width: 100%;
            max-width: 400px;
        }
        h2 {
            margin-top: 0;
            color: #333;
        }
        input[type="file"] {
            margin: 20px 0;
            padding: 10px;
            width: 90%;
            border: 2px dashed #ccc;
            border-radius: 8px;
            cursor: pointer;
        }
        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.3s;
            width: 100%;
        }
        button:hover {
            background-color: #0056b3;
        }
        button:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
        #status {
            margin-top: 15px;
            font-size: 14px;
            color: #666;
        }
        #downloadLink {
            display: inline-block;
            margin-top: 20px;
            text-decoration: none;
            color: white;
            background-color: #28a745;
            padding: 10px 20px;
            border-radius: 6px;
        }
        #downloadLink:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🎵 M4A ➔ MP3 변환기</h2>
    <p>서버 전송 없이 브라우저에서 직접 변환합니다.</p>
    
    <input type="file" id="audioFile" accept=".m4a">
    <button id="convertBtn">MP3로 변환 시작</button>
    
    <div id="status"></div>
    <a id="downloadLink" style="display: none;">다운로드 MP3</a>
</div>

<script>
    const { createFFmpeg, fetchFile } = FFmpeg;
    // FFmpeg 인스턴스 생성
    const ffmpeg = createFFmpeg({ log: true });

    const fileInput = document.getElementById('audioFile');
    const convertBtn = document.getElementById('convertBtn');
    const statusDiv = document.getElementById('status');
    const downloadLink = document.getElementById('downloadLink');

    convertBtn.addEventListener('click', async () => {
        const files = fileInput.files;
        if (files.length === 0) {
            alert('M4A 파일을 먼저 선택해주세요.');
            return;
        }

        const file = files[0];
        if (!file.name.toLowerCase().endsWith('.m4a')) {
            alert('M4A 파일만 지원합니다.');
            return;
        }

        try {
            convertBtn.disabled = true;
            statusDiv.innerHTML = "엔진 로딩 중... (처음엔 시간이 걸릴 수 있습니다) ⏳";
            downloadLink.style.display = 'none';

            // FFmpeg 로드 (메모리에 WebAssembly 로드)
            if (!ffmpeg.isLoaded()) {
                await ffmpeg.load();
            }

            statusDiv.innerHTML = "변환 중입니다. 잠시만 기다려주세요... ⚙️";

            // 가상 파일 시스템에 파일 쓰기
            ffmpeg.FS('writeFile', 'input.m4a', await fetchFile(file));

            // 변환 명령어 실행 (M4A -> MP3)
            await ffmpeg.run('-i', 'input.m4a', 'output.mp3');

            statusDiv.innerHTML = "변환 완료! 파일을 생성 중입니다... ✅";

            // 가상 파일 시스템에서 변환된 파일 읽기
            const data = ffmpeg.FS('readFile', 'output.mp3');

            // Blob으로 변환하여 다운로드 링크 생성
            const blob = new Blob([data.buffer], { type: 'audio/mp3' });
            const url = URL.createObjectURL(blob);

            downloadLink.href = url;
            downloadLink.download = file.name.replace(/\.[^/.]+$/, "") + ".mp3";
            downloadLink.style.display = 'inline-block';
            statusDiv.innerHTML = "성공적으로 변환되었습니다!";

        } catch (error) {
            console.error(error);
            statusDiv.innerHTML = "❌ 변환 중 오류가 발생했습니다. 개발자 도구를 확인하세요.";
        } finally {
            convertBtn.disabled = false;
        }
    });
</script>

</body>
</html>
