<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M4A to MP3 변환기 (LameJS Engine)</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lamejs/1.2.1/lame.min.js"></script>
    
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: white; padding: 35px; border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05); text-align: center;
            width: 100%; max-width: 440px;
        }
        h2 { margin-top: 0; color: #1a1a1a; font-size: 24px; }
        p { color: #666; font-size: 14px; margin-bottom: 25px; }
        
        .file-box {
            margin: 20px 0; padding: 40px 20px; border: 2px dashed #cbd5e1; 
            border-radius: 12px; background-color: #f8fafc; transition: all 0.2s ease-in-out; 
            display: flex; flex-direction: column; align-items: center; gap: 15px;
        }
        .file-box.dragover { border-color: #2563eb; background-color: #eff6ff; transform: scale(1.02); }
        #fileInfo { color: #64748b; font-size: 14px; line-height: 1.6; word-break: break-all; }
        
        .browse-btn {
            background-color: white; color: #2563eb; border: 1px solid #2563eb;
            padding: 8px 16px; font-size: 14px; border-radius: 6px; cursor: pointer; transition: all 0.2s;
        }
        .browse-btn:hover { background-color: #eff6ff; }

        .convert-btn {
            background-color: #2563eb; color: white; border: none; padding: 14px; 
            font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; 
            width: 100%; margin-top: 10px; transition: background-color 0.2s;
        }
        .convert-btn:hover { background-color: #1d4ed8; }
        .convert-btn:disabled { background-color: #94a3b8; cursor: not-allowed; }
        
        #status { margin-top: 20px; font-size: 14px; color: #475569; min-height: 20px; line-height: 1.5; }
        #downloadLink {
            display: inline-block; margin-top: 20px; text-decoration: none; color: white; 
            background-color: #10b981; padding: 12px 24px; font-weight: bold; 
            border-radius: 8px; width: calc(100% - 48px); transition: background-color 0.2s;
        }
        #downloadLink:hover { background-color: #059669; }
    </style>
</head>
<body>

<div class="container">
    <h2>🎵 M4A ➔ MP3 변환기</h2>
    <p>서버 전송 없이 브라우저 자체 기능으로 빠르고 안전하게 변환합니다.</p>
    
    <div class="file-box" id="dropZone">
        <input type="file" id="audioFile" accept=".m4a" style="display: none;">
        <div id="fileInfo">📂 <strong>M4A 파일을 이곳으로 끌어오세요</strong></div>
        <button class="browse-btn" id="browseBtn">컴퓨터에서 파일 불러오기</button>
    </div>
    
    <button id="convertBtn" class="convert-btn">MP3로 변환 시작</button>
    
    <div id="status">파일을 선택하고 변환 버튼을 눌러주세요.</div>
    <a id="downloadLink" style="display: none;">📥 변환된 MP3 다운로드</a>
</div>

<script>
    let selectedFile = null;

    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('audioFile');
    const fileInfo = document.getElementById('fileInfo');
    const browseBtn = document.getElementById('browseBtn');
    const convertBtn = document.getElementById('convertBtn');
    const statusDiv = document.getElementById('status');
    const downloadLink = document.getElementById('downloadLink');

    // --- 1. 파일 UI 및 드래그 로직 (이전과 동일) ---
    browseBtn.addEventListener('click', () => { fileInput.value = ''; fileInput.click(); });
    fileInput.addEventListener('change', (e) => { if (e.target.files.length > 0) handleFile(e.target.files[0]); });

    ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(e => {
        dropZone.addEventListener(e, preventDefaults, false);
        document.body.addEventListener(e, preventDefaults, false);
    });

    function preventDefaults(e) { e.preventDefault(); e.stopPropagation(); }
    ['dragenter', 'dragover'].forEach(e => dropZone.addEventListener(e, () => dropZone.classList.add('dragover'), false));
    ['dragleave', 'drop'].forEach(e => dropZone.addEventListener(e, () => dropZone.classList.remove('dragover'), false));

    dropZone.addEventListener('drop', (e) => {
        if (e.dataTransfer.files.length > 0) handleFile(e.dataTransfer.files[0]);
    });

    function handleFile(file) {
        if (!file.name.toLowerCase().endsWith('.m4a')) {
            alert('M4A 형식의 파일만 지원합니다.');
            selectedFile = null;
            fileInfo.innerHTML = `📂 <strong>M4A 파일을 이곳으로 끌어오세요</strong>`;
            statusDiv.innerHTML = "❌ M4A 파일이 아닙니다.";
            return;
        }
        selectedFile = file;
        const fileSizeMB = (file.size / (1024 * 1024)).toFixed(2);
        fileInfo.innerHTML = `📄 <strong>선택된 파일:</strong><br>${file.name}<br><span style="font-size: 12px; color: #2563eb; font-weight: bold;">(${fileSizeMB} MB)</span>`;
        statusDiv.innerHTML = "✅ 변환 준비 완료! '변환 시작' 버튼을 누르세요.";
        downloadLink.style.display = 'none';
    }

    // --- 2. 브라우저 내장 디코더 + LameJS 변환 로직 (보안 충돌 0%) ---
    convertBtn.addEventListener('click', async () => {
        if (!selectedFile) {
            alert('M4A 파일을 먼저 추가해주세요.');
            return;
        }

        try {
            convertBtn.disabled = true;
            downloadLink.style.display = 'none';
            
            // 1단계: M4A 파일을 브라우저의 기본 오디오 엔진으로 읽어들이기
            statusDiv.innerHTML = "브라우저 엔진으로 오디오 파일 분석 중... 🔍";
            const arrayBuffer = await selectedFile.arrayBuffer();
            const audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const audioBuffer = await audioContext.decodeAudioData(arrayBuffer);

            // 2단계: MP3 인코딩 준비
            const channels = audioBuffer.numberOfChannels;
            const sampleRate = audioBuffer.sampleRate;
            const mp3encoder = new lamejs.Mp3Encoder(channels, sampleRate, 128); // 128kbps 음질
            const mp3Data = [];

            // 소리 데이터(Float32)를 LameJS가 읽을 수 있는 형식(Int16)으로 변환하는 함수
            function floatTo16BitPCM(input) {
                const output = new Int16Array(input.length);
                for (let i = 0; i < input.length; i++) {
                    const s = Math.max(-1, Math.min(1, input[i]));
                    output[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
                }
                return output;
            }

            const leftPCM = floatTo16BitPCM(audioBuffer.getChannelData(0));
            const rightPCM = channels > 1 ? floatTo16BitPCM(audioBuffer.getChannelData(1)) : null;

            const sampleBlockSize = 1152; // LameJS 처리 단위

            // 3단계: 파일을 잘게 쪼개서 MP3로 변환하며 진행률 표시
            for (let i = 0; i < leftPCM.length; i += sampleBlockSize) {
                const leftChunk = leftPCM.subarray(i, i + sampleBlockSize);
                let mp3buf;
                
                if (channels === 2) {
                    const rightChunk = rightPCM.subarray(i, i + sampleBlockSize);
                    mp3buf = mp3encoder.encodeBuffer(leftChunk, rightChunk);
                } else {
                    mp3buf = mp3encoder.encodeBuffer(leftChunk);
                }
                
                if (mp3buf.length > 0) mp3Data.push(mp3buf);

                // 화면 멈춤 방지 및 50번마다 진행률(%) 업데이트
                if ((i / sampleBlockSize) % 50 === 0) {
                    const progress = Math.round((i / leftPCM.length) * 100);
                    statusDiv.innerHTML = `MP3로 변환 중... <span style="color:#2563eb; font-weight:bold;">${progress}%</span> ⚙️`;
                    await new Promise(r => setTimeout(r, 0)); // 브라우저가 숨통을 트게 해줌
                }
            }

            // 남은 데이터 털어내기
            const mp3buf = mp3encoder.flush();
            if (mp3buf.length > 0) mp3Data.push(mp3buf);

            // 4단계: 완성된 MP3를 다운로드 파일로 묶기
            statusDiv.innerHTML = "파일 처리 완료! 다운로드 링크를 생성합니다... 📄";
            const blob = new Blob(mp3Data, { type: 'audio/mp3' });
            const url = URL.createObjectURL(blob);
            
            const outputName = selectedFile.name.replace(/\.[^/.]+$/, "") + ".mp3";

            downloadLink.href = url;
            downloadLink.download = outputName;
            downloadLink.style.display = 'inline-block';
            statusDiv.innerHTML = "🎉 성공적으로 변환되었습니다!";

        } catch (error) {
            console.error("Conversion Error:", error);
            statusDiv.innerHTML = `❌ 오류 발생: 지원하지 않는 파일이거나 손상된 파일입니다.<br><span style="color:red; font-size:12px;">${error.message}</span>`;
        } finally {
            convertBtn.disabled = false;
        }
    });
</script>

</body>
</html>
